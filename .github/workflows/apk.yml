# Android APK.
#
# - Oznaka v1.2.3 (git tag): potpisan APK ide na GitHub Releases kao nova verzija.
#   Aplikacija na mobitelu to vidi i pokaže "Nova verzija".
# - Push na main koji dira Android ili kod: probni APK, samo kao prilog ovom pokretanju,
#   da se odmah vidi ako se build pokvario. Ne objavljuje se.
#
# Ključ za potpis dolazi iz tajni repoa (Settings → Secrets and variables → Actions):
#   HAVA_KEYSTORE_B64      ključ (.p12) kao base64 tekst
#   HAVA_KEYSTORE_LOZINKA  lozinka ključa
name: APK

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IMA_KLJUC: ${{ secrets.HAVA_KEYSTORE_B64 != '' }}
      JE_IZDANJE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 traži Javu 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - run: npm test

      - name: Verzija
        run: |
          if [ "$JE_IZDANJE" = "true" ]; then
            VERZIJA="${GITHUB_REF_NAME#v}"
            if ! echo "$VERZIJA" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
              echo "::error::Oznaka mora biti oblika v1.2.3 (najviše dvije cifre za drugi i treći broj)."
              exit 1
            fi
            # Verzija u aplikaciji (prikaz i provjera nove verzije) mora biti ista kao oznaka.
            npm version "$VERZIJA" --no-git-tag-version --allow-same-version
          else
            VERZIJA="$(node -p "require('./package.json').version")"
          fi
          IFS=. read -r A B C <<< "$VERZIJA"
          # 1.2.3 -> 10203. Mora rasti sa svakom verzijom (src/logic/verzija.ts radi isto).
          echo "HAVA_VERSION_CODE=$((A * 10000 + B * 100 + C))" >> "$GITHUB_ENV"
          echo "HAVA_VERSION_NAME=$VERZIJA" >> "$GITHUB_ENV"
          echo "VERZIJA=$VERZIJA" >> "$GITHUB_ENV"

      - run: npm run android

      - name: Ključ za potpis
        if: env.IMA_KLJUC == 'true'
        env:
          KLJUC_B64: ${{ secrets.HAVA_KEYSTORE_B64 }}
        run: |
          echo "$KLJUC_B64" | base64 -d > "$RUNNER_TEMP/hava.p12"
          echo "HAVA_KEYSTORE=$RUNNER_TEMP/hava.p12" >> "$GITHUB_ENV"

      - name: Izdanje bez ključa ne ide
        if: env.JE_IZDANJE == 'true' && env.IMA_KLJUC != 'true'
        run: |
          echo "::error::Nema tajne HAVA_KEYSTORE_B64. Nepotpisan APK se ne objavljuje."
          exit 1

      - name: Build
        working-directory: android
        env:
          HAVA_KEYSTORE_LOZINKA: ${{ secrets.HAVA_KEYSTORE_LOZINKA }}
        run: |
          chmod +x gradlew
          if [ "$IMA_KLJUC" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Hava-$VERZIJA.apk"
          else
            # Bez ključa: probni APK potpisan Androidovim ključem za testiranje.
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Hava-$VERZIJA-proba.apk"
          fi

      - name: Provjera potpisa
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Nema apksignera u Android SDK-u."
            exit 1
          fi
          for f in "$RUNNER_TEMP"/Hava-*.apk; do
            IZLAZ="$("$APKSIGNER" verify --print-certs "$f" 2>&1)" || {
              echo "::error::Potpis nije ispravan: $(echo "$IZLAZ" | tr '\n' ' ' | cut -c1-400)"
              exit 1
            }
            # Otisak ključa kao napomena: mora biti isti kao u Hava-kljuc/PROCITAJ.txt.
            echo "::notice title=$(basename "$f")::$(echo "$IZLAZ" | grep -E 'certificate (DN|SHA-256)' | tr '\n' ' ')"
          done

      - name: Prilog (probni build)
        if: env.JE_IZDANJE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Hava-${{ env.VERZIJA }}-${{ github.run_number }}
          path: ${{ runner.temp }}/Hava-*.apk
          retention-days: 14

      - name: GitHub izdanje
        if: env.JE_IZDANJE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Hava-$VERZIJA.apk" \
            --title "Hava $VERZIJA" \
            --notes "Android aplikacija. Preuzmi Hava-$VERZIJA.apk na mobitelu i otvori ga. Ako Android pita, dozvoli instalaciju iz ovog izvora. Web verzija: https://cooksaa.github.io/hava/"
