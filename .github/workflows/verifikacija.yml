# Jednom sedmično: koliko koji model prognoze pogađa prema aerodromskim stanicama.
# Rezultat je u sažetku pokretanja (Actions → Verifikacija → zadnje pokretanje).
# Ako neki drugi model počne pogađati bolje od ICON-2I, ovdje se vidi.
name: Verifikacija

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifikacija:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/verifikacija.mjs 14
